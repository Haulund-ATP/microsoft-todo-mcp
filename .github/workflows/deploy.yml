name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image reference
        run: echo "IMAGE=ghcr.io/${GH_REPO,,}:sha-${{ github.sha }}" >> "$GITHUB_ENV"
        env:
          GH_REPO: ${{ github.repository }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

      # No client secret: federated OIDC credential configured by
      # scripts/configure-github-oidc.ps1 against a deploy-only app
      # registration scoped to Contributor on just this resource group.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}"

      - name: Resolve Container App FQDN
        id: fqdn
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" --output tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: pwsh
        run: ./scripts/test-production.ps1 -BaseUrl "https://${{ steps.fqdn.outputs.fqdn }}"
